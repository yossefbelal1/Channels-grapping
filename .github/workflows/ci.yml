name: CI Pipeline & Production Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Lint, Syntax & Unit Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: leadhunter_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Python Syntax & Bytecode Compilation Check
        run: |
          python -m compileall -q .

      - name: Run Ruff Linter
        run: |
          ruff check . --select=E9,F63,F7,F82 --show-source

      - name: Run Unit Tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: leadhunter_test_db
          DB_USER: postgres
          DB_PASSWORD: testpassword
        run: |
          python -m unittest discover -s tests -v

      - name: Security Vulnerability Scan (pip-audit)
        run: |
          pip-audit --ignore-vuln CVE-2024-XXXX || true
